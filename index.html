\" class=\"fx-in\" autocomplete=\"email\" placeholder=\"you@company.com\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div><label for=\"fx-city\" class=\"fx-lbl\">City / State<\u002Flabel><input id=\"fx-city\" name=\"city\" class=\"fx-in\" autocomplete=\"address-level2\" placeholder=\"e.g. Bengaluru, Karnataka\"><\u002Fdiv>\n                <div><label for=\"fx-svc\" class=\"fx-lbl\">Service<\u002Flabel><input id=\"fx-svc\" name=\"service\" class=\"fx-in\" value=\"{{ formSvc }}\" sc-camel-on-change=\"{{ setSvc }}\"><\u002Fdiv>\n                <div><label for=\"fx-msg\" class=\"fx-lbl\">Tell us briefly<\u002Flabel><textarea id=\"fx-msg\" name=\"message\" class=\"fx-in\" rows=\"3\" placeholder=\"Entity type, turnover, deadline or notice date…\" style=\"resize:vertical\"><\u002Ftextarea><\u002Fdiv>\n                <button type=\"submit\" class=\"fx-btn\" style=\"display:inline-flex;justify-content:center;align-items:center;gap:10px;padding:15px 24px;border-radius:999px;background:var(--x);color:var(--bg);font-weight:600;font-size:15px;margin-top:6px\">Send enquiry <span aria-hidden=\"true\">→<\u002Fspan><\u002Fbutton>\n              <\u002Fform>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:20px;font-size:13.5px;color:var(--muted)\">\n                <span>Prefer to talk?<\u002Fspan>\n                <a href=\"{{ waUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"color:var(--fg);font-weight:600\">WhatsApp<\u002Fa>\n                <a href=\"tel:+919177406648\" style=\"color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums\">+91 91774 06648<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"margin-top:72px;border-top:1px solid var(--line);padding-top:28px\">\n      <div class=\"fx-lbl\">Other service groups<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:16px\">\n        <sc-for list=\"{{ others }}\" as=\"o\" hint-placeholder-count=\"7\"><button type=\"button\" class=\"fx-btn fx-pill\" sc-camel-on-click=\"{{ o.open }}\" style=\"border:1px solid var(--line);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:500\"><span style=\"color:var(--x);font-weight:700;margin-right:6px\">{{ o.idx }}<\u002Fspan>{{ o.title }}<\u002Fbutton><\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  // Service catalogue. Each sub-service: [name, short description, what's included, timeline, documents (optional — falls back to the group list)]\n  G = [\n    { title: 'Bookkeeping', body: 'Day-to-day accounting kept current and clean — sales, purchases, expenses, bank and card reconciliations, fixed assets and month-end close. You get a set of books that is always ready for a lender, an investor or the tax department.',\n      docs: ['Bank and credit-card statements', 'Sales and purchase invoices', 'Expense bills and vouchers', 'Previous year trial balance / books', 'Access to your accounting software'],\n      subs: [\n        ['Monthly bookkeeping', 'Every sales, purchase, expense and journal entry posted and closed by the 10th of the following month.', ['Voucher entry from invoices and bank feeds', 'Month-end close with trial balance', 'Ledger scrutiny and correction of wrong postings'], 'Ongoing · monthly'],\n        ['Bank & card reconciliation', 'Bank, credit-card and payment-gateway statements matched line by line with the books.', ['Reconciliation for every bank and card account', 'Gateway settlements (Razorpay, PayU, Stripe) matched to sales', 'List of unreconciled items with the action owner'], 'Monthly · 3–5 working days'],\n        ['Payables & receivables', 'Vendor and customer ledgers kept accurate, with ageing reports so cash is collected and paid on time.', ['Vendor ledger reconciliation and payment schedule', 'Customer ageing and overdue follow-up list', 'MSME 45-day payment tracking under Sec 43B(h)'], 'Ongoing · weekly / monthly'],\n        ['Payroll processing', 'Monthly salary computation with the statutory deductions that go with it.', ['Salary register and payslips', 'PF, ESI and professional tax computation and challans', 'TDS on salary (Sec 192) and Form 16'], 'Monthly · before pay date', ['Employee master (PAN, Aadhaar, UAN, bank details)', 'Attendance and leave records', 'Salary structure and revisions', 'Investment declarations for TDS']],\n        ['MIS & management reports', 'A monthly pack that shows how the business is really doing — not just what was posted.', ['Profit & loss by month, product or branch', 'Cash-flow and working-capital summary', 'Budget vs actual with variance notes'], 'Monthly · by the 15th'],\n        ['Software setup & migration', 'Tally, Zoho Books or QuickBooks set up correctly — or your old books moved across without losing history.', ['Chart of accounts with GST and TDS configuration', 'Opening balances and historical data migration', 'User roles and approval workflow'], 'One-time · 1–2 weeks'],\n        ['Final accounts', 'Year-end balance sheet, profit & loss and schedules, ready for audit and the income tax return.', ['Year-end adjustments, provisions and depreciation', 'Balance sheet and P&L in Schedule III format', 'Notes, schedules and audit-ready working papers'], 'Annual · 2–3 weeks']\n      ] },\n    { title: 'Tax compliance', body: 'All the returns, on time, every time — GST, income tax, TDS and TCS — with ITC reconciled against GSTR-2B before anything is filed, and advance tax planned instead of paid in a panic.',\n      docs: ['PAN of the business', 'GST and income tax portal login', 'Sales and purchase registers', 'Bank statements for the period', 'Previous returns filed'],\n      subs: [\n        ['GST registration', 'New GSTIN for a business, branch or additional place of business, including Aadhaar authentication.', ['Advice on eligibility and state-wise registration', 'REG-01 application and reply to any query (REG-03)', 'Registration certificate and first-return guidance'], '7–10 working days', ['PAN of business and of proprietor / partners / directors', 'Aadhaar of the authorised signatory', 'Proof of place of business with rent agreement or NOC', 'Bank proof (cancelled cheque or statement)', 'Constitution document (deed / incorporation certificate)']],\n        ['GST return filing', 'GSTR-1 and GSTR-3B filed on time every month or quarter (QRMP), with liability and ITC checked before filing.', ['GSTR-1 outward supply return matched with e-invoices', 'GSTR-3B with tax computation and payment challan', 'IMS action on supplier invoices before 3B'], 'Monthly / quarterly'],\n        ['GST annual return (GSTR-9 / 9C)', 'Annual return and reconciliation statement prepared from the books, with differences explained before filing.', ['Books vs GSTR-1 / 3B reconciliation', 'GSTR-9 table-wise preparation', 'GSTR-9C reconciliation statement (turnover above ₹5 crore)'], 'Annual · due 31 December'],\n        ['ITC reconciliation', 'Input tax credit in your books matched against GSTR-2B, so you claim everything you are entitled to and nothing you are not.', ['Invoice-level books vs GSTR-2B match', 'Vendor follow-up list for missing invoices', 'Rule 37 / 37A reversal tracking'], 'Monthly'],\n        ['Income tax return filing', 'ITR for individuals, firms, LLPs, companies and trusts — with AIS and 26AS reconciled before filing.', ['AIS, TIS and Form 26AS reconciliation', 'Computation of income and tax', 'ITR filing, e-verification and refund tracking'], 'Annual · from 3 working days', ['PAN and Aadhaar', 'Form 16 / 16A and AIS', 'Bank statements and interest certificates', 'Capital gains statements', 'Investment and deduction proofs']],\n        ['TDS / TCS return filing', 'Quarterly TDS and TCS returns filed with the correct sections, rates and PANs, so deductees get their credit.', ['Section-wise TDS computation and challans', '24Q, 26Q, 27Q and 27EQ returns', 'Form 16 / 16A issue and correction returns'], 'Quarterly'],\n        ['Advance tax planning', 'Tax estimated each quarter so you pay the right amount by 15 June, September, December and March — and avoid 234B / 234C interest.', ['Quarterly income and tax estimate', 'Challan payment schedule', 'Review of interest exposure'], 'Quarterly'],\n        ['Tax audit support', 'Books and records prepared for the Sec 44AB tax audit, with every Form 3CD clause backed by working papers.', ['Clause-wise schedules for Form 3CD', 'Sec 40A(3), 43B and TDS default analysis', 'Coordination with the tax auditor'], 'Annual · due 30 September']\n      ] },\n    { title: 'Corporate filings', body: 'Companies and LLPs carry a calendar of MCA filings, board and shareholder meetings and statutory registers. We maintain that calendar so nothing slips and nothing attracts a late fee.',\n      docs: ['Certificate of incorporation', 'MOA & AOA or LLP agreement', 'Audited financial statements', 'PAN and DSC of directors / partners', 'Previous MCA filings'],\n      subs: [\n        ['Annual ROC filing (company)', 'AOC-4 and MGT-7 / 7A filed with MCA within due dates, so no ₹100-a-day late fee builds up.', ['AOC-4 filing of financial statements', 'MGT-7 / MGT-7A annual return', 'ADT-1 for auditor appointment'], 'Annual · within 30 / 60 days of AGM'],\n        ['LLP annual filing', 'Form 11 and Form 8 for LLPs, filed on time with partner contribution details correct.', ['Form 11 annual return (due 30 May)', 'Form 8 statement of accounts & solvency (due 30 October)', 'Check of designated partner details'], 'Annual'],\n        ['Board & AGM minutes', 'Notices, agendas, resolutions and minutes drafted to meet the Companies Act and Secretarial Standards.', ['Board meeting notice, agenda and minutes', \"AGM notice and directors' report\", 'MGT-14 for resolutions that must be filed'], 'Per meeting'],\n        ['Director changes & DIN KYC', 'Appointment, resignation or change in designation of directors, plus the yearly DIR-3 KYC.', ['DIR-12 filing with board resolution', 'DIN application for new directors', 'DIR-3 KYC (due 30 September)'], '3–5 working days'],\n        ['Share allotment & transfer', 'Fresh allotment, rights issue, or transfer of shares between holders — documented and filed correctly.', ['PAS-3 return of allotment', 'Share certificates and SH-4 transfer deed', 'Stamp duty computation and register update'], '5–10 working days'],\n        ['Charge registration', 'Creation, modification or satisfaction of charge on loans secured against company assets.', ['CHG-1 for creation / modification', 'CHG-4 for satisfaction on loan closure', 'Register of charges update'], 'Within 30 days of the loan', ['Sanction letter and loan agreement', 'Hypothecation / mortgage deed', 'Board resolution for borrowing', 'DSC of a director']],\n        ['Registered office change', 'Shift of registered office within the city, within the state, or to another state.', ['Board / special resolution drafting', 'INC-22 filing (and INC-23 for inter-state shift)', 'Updated address on PAN, GST and bank'], '1–4 weeks depending on type'],\n        ['Company / LLP closure', 'Strike-off of a company or LLP that has stopped business, with liabilities cleared first.', ['STK-2 for companies / Form 24 for LLPs', 'Statement of accounts and indemnity bonds', 'Pending filings completed before application'], '3–6 months (MCA processing)']\n      ] },\n    { title: 'FEMA & RBI compliance', body: 'Foreign investment coming in, or money going out, has its own rulebook. We handle the reporting to RBI and the paperwork around foreign shareholders, overseas subsidiaries and cross-border loans.',\n      docs: ['FIRC and KYC of the remitter', 'Valuation report', 'Board resolution for the transaction', 'KYC of the foreign investor', 'Latest audited financials'],\n      subs: [\n        ['FC-GPR reporting', 'Reporting of shares issued to a foreign investor on the FIRMS portal within 30 days of allotment.', ['Pricing guideline check with valuation report', 'FC-GPR filing with KYC and FIRC', 'Reply to AD bank / RBI queries'], 'Within 30 days of allotment'],\n        ['FC-TRS reporting', 'Reporting of a share transfer between a resident and a non-resident within 60 days.', ['Pricing guideline compliance', 'FC-TRS filing on FIRMS', 'Coordination with the AD bank'], 'Within 60 days of transfer'],\n        ['Annual FLA return', 'Foreign Liabilities and Assets return for every entity with FDI or ODI.', ['FLA return on the FLAIR portal', 'Reconciliation with audited financials', 'Filing by 15 July every year'], 'Annual · due 15 July'],\n        ['ODI & APR filings', 'Overseas investment by an Indian entity or individual — set up and reported under the ODI Rules, 2022.', ['Form ODI and AD bank documentation', 'Annual Performance Report (APR)', 'Disinvestment / restructuring reporting'], 'Per transaction · annual APR'],\n        ['ECB reporting', 'External commercial borrowings from foreign lenders — loan registration number, monthly returns and changes.', ['Form ECB for Loan Registration Number', 'Monthly ECB-2 return', 'Change in terms / cancellation of LRN'], 'Monthly'],\n        ['Foreign remittance (15CA / 15CB)', 'Payments abroad with tax withheld correctly and the Form 15CB certificate the bank needs.', ['Taxability and DTAA analysis', 'Form 15CB CA certificate', 'Form 15CA filing and LRS advice for individuals'], '1–2 working days', ['Invoice / agreement with the foreign party', 'Tax residency certificate and Form 10F of payee', 'No-PE declaration (where relevant)', 'Remitter PAN and bank details']],\n        ['Compounding of contraventions', 'Late or missed FEMA reporting regularised through late submission fee or compounding with RBI.', ['Review of contravention and LSF computation', 'Compounding application drafting', 'Representation before RBI'], '2–4 months']\n      ] },\n    { title: 'Business incorporation', body: 'From choosing the right structure to the first bank account. Private limited, LLP, OPC or partnership — set up correctly, with every registration you need to start invoicing on day one.',\n      docs: ['PAN and Aadhaar of founders', 'Passport-size photographs', 'Address proof (utility bill not older than 2 months)', 'Registered office proof with owner NOC', 'Email ID and mobile of each founder'],\n      subs: [\n        ['Private limited company', 'Company incorporated through SPICe+ with PAN, TAN, EPFO, ESIC and bank account in one application.', ['Name reservation and MOA / AOA drafting', 'DSC and DIN for directors', 'Certificate of incorporation, PAN and TAN'], '10–15 working days'],\n        ['LLP registration', 'Limited liability partnership registered through FiLLiP, with the LLP agreement filed within 30 days.', ['Name reservation (RUN-LLP)', 'FiLLiP filing with DPIN', 'LLP agreement drafting and Form 3 filing'], '10–15 working days'],\n        ['One person company (OPC)', 'A company with a single shareholder and a nominee — limited liability for solo founders.', ['Nominee consent (INC-3)', 'SPICe+ incorporation', 'Guidance on conversion when limits are crossed'], '10–15 working days'],\n        ['Partnership firm registration', 'Partnership deed drafted and the firm registered with the state Registrar of Firms.', ['Partnership deed with capital and profit-sharing clauses', 'Stamp duty and notarisation', 'Registration with Registrar of Firms and firm PAN'], '2–4 weeks (state dependent)'],\n        ['Startup India (DPIIT) recognition', 'DPIIT recognition that opens 80-IAC tax holiday eligibility and other Startup India benefits.', ['Eligibility check and write-up on innovation', 'DPIIT application on the Startup India portal', '80-IAC application to the Inter-Ministerial Board'], '2–4 weeks', ['Certificate of incorporation', 'Short write-up on the product / innovation', 'Pitch deck or website', 'Director details']],\n        ['Udyam (MSME) registration', 'Udyam certificate for micro, small and medium enterprises — needed for MSME benefits and the 45-day payment protection.', ['Classification by investment and turnover', 'Udyam portal registration with Aadhaar', 'Certificate and yearly updation'], '1–2 working days', ['Aadhaar of proprietor / authorised signatory', 'PAN and GSTIN of the business', 'Bank account details', 'Investment in plant & machinery and turnover']],\n        ['Import Export Code (IEC)', 'IEC from DGFT — mandatory for any business that imports or exports goods or services.', ['DGFT application with DSC / Aadhaar', 'Linking of bank details', 'Annual IEC update (April–June)'], '1–3 working days', ['PAN of the business', 'Address proof of the business', 'Cancelled cheque or bank certificate', 'Aadhaar / DSC of the applicant']],\n        ['PAN, TAN & other registrations', 'The registrations a new business needs before the first invoice.', ['PAN and TAN application', 'Professional tax and Shops & Establishment registration', 'PF and ESI registration'], '3–10 working days'],\n        [\"Founders' agreement\", 'Equity split, vesting, roles and exit terms agreed in writing before they become a dispute.', ['Equity and vesting schedule', 'IP assignment and non-compete clauses', 'Exit, buy-back and deadlock terms'], '1–2 weeks', ['Founder details and agreed equity split', 'Roles and time commitment of each founder', 'Any existing term sheet or investor terms']]\n      ] },\n    { title: 'Litigation & representation', body: 'When a notice arrives, you need a reply that is specific, well-sequenced and grounded in law. We draft it, appear before the officer, and take the matter through appeal if it comes to that.',\n      docs: ['Copy of the notice / order', 'Returns for the period concerned', 'Books and reconciliations for the period', 'Earlier replies and orders, if any', 'Portal login credentials'],\n      subs: [\n        ['GST show cause notice reply', 'Point-wise reply to SCNs under Sec 73 / 74, with each allegation answered on facts, law and case law.', ['Notice review and fact-finding with your team', 'Reply in DRC-06 with annexures and case law', 'Personal hearing representation'], 'Within the time given in the notice'],\n        ['Income tax notices & scrutiny', 'Replies to notices under Sec 143(2), 142(1), 148 and 148A, and representation in faceless assessment.', ['Notice analysis and response plan', 'Submissions on the e-proceedings portal', 'Video-hearing representation'], 'As per notice dates'],\n        ['GST audit support', 'Support during departmental audits under Sec 65 and special audits, so observations are answered before they become a demand.', ['Pre-audit check of returns and ITC', 'Document compilation for the audit team', 'Reply to audit observations'], 'During the audit period'],\n        ['First appeals', 'Appeal against the order before the GST Appellate Authority (APL-01) or CIT(Appeals) (Form 35).', ['Grounds of appeal and statement of facts', 'Pre-deposit computation and filing', 'Hearing and written submissions'], '3 months from order (GST) · 30 days (income tax)'],\n        ['GSTAT & ITAT appeals', 'Second appeals before the GST Appellate Tribunal and the Income Tax Appellate Tribunal.', ['Appeal memo and paper book', 'Additional pre-deposit for GSTAT', 'Representation and written synopsis'], 'As per tribunal timelines'],\n        ['Refund proceedings', 'GST refunds for exports, inverted duty and excess cash — including replies to RFD-08 notices.', ['Refund computation under Rule 89', 'RFD-01 application with statements', 'Reply to RFD-08 and appeal against rejection'], '60 days statutory processing'],\n        ['Departmental representation', 'Appearance before GST and income tax officers for hearings, summons and inquiries.', ['Preparation of submissions', 'Personal appearance with authorisation', 'Record of proceedings and follow-up'], 'Per hearing']\n      ] },\n    { title: 'Business consulting & transaction advisory', body: 'Raising a round, buying a business, restructuring the group or planning an exit. We model the numbers, structure the deal for tax, and run the diligence so the decision is made on facts.',\n      docs: ['Last 3 years financial statements', 'Current-year MIS', 'Business plan / projections', 'Cap table', 'Key customer and vendor contracts'],\n      subs: [\n        ['Financial modelling & valuation', 'Three-statement models and valuations using DCF and market methods — for fundraising, ESOPs and FEMA pricing.', ['Projected P&L, balance sheet and cash flow', 'DCF / comparable-company valuation', 'Registered valuer coordination where required by law'], '2–3 weeks'],\n        ['Fundraise readiness', 'Books, cap table and data room put in order before you meet investors.', ['Cap table and ESOP pool modelling', 'Data room and compliance clean-up', 'Investor-ready MIS and unit economics'], '3–6 weeks'],\n        ['Due diligence', \"Independent review of a target's numbers, tax exposure and compliance before you sign.\", ['Quality of earnings and working-capital review', 'GST, income tax and TDS exposure analysis', 'Red-flag report with deal recommendations'], '2–4 weeks'],\n        ['Deal structuring', 'Share purchase, asset purchase, slump sale or merger — structured for tax and FEMA compliance.', ['Structure options with the tax cost of each', 'Sec 50B and 56(2)(x) analysis', 'Transaction document review'], '1–3 weeks'],\n        ['Group restructuring', 'Mergers, demergers, conversions and holding structures that simplify the group.', ['Restructuring options and tax impact', 'Company-to-LLP or firm-to-company conversion', 'NCLT / fast-track merger coordination'], '2–6 months'],\n        ['Virtual CFO', 'A part-time finance head for budgets, cash planning, board reporting and lender relationships.', ['Annual budget and monthly cash forecast', 'Board and investor reporting', 'Banking, working capital and cost control'], 'Ongoing · monthly retainer'],\n        ['Project reports & CMA data', 'Bank-ready project reports and CMA data for term loans and working-capital limits.', ['Project cost, means of finance and projections', 'CMA data with DSCR and current ratio', 'Support on bank queries till sanction'], '1–2 weeks', ['KYC of promoters and the entity', 'Last 3 years financials and ITRs', 'Quotations for machinery / project cost', 'Existing loan sanction letters']]\n      ] },\n    { title: 'Other services', body: 'Audits, certificates and registrations outside the seven main groups — stock audits, certificates of origin, export council memberships, trademarks and food licences — handled by the same team.',\n      docs: ['PAN and GST registration of the business', 'KYC of the proprietor / directors', 'Documents specific to the service (we share the list)'],\n      subs: [\n        ['Stock audit', 'Bank stock audit and inventory verification for manufacturing, textile & apparel, retail and pharmaceutical units.', ['Physical verification and valuation of stock', 'Check of stock statement and drawing power', \"Audit report in the bank's format\"], '3–7 working days', ['Bank sanction letter and stock statement format', 'Latest stock statement submitted to the bank', 'Stock register and purchase / sales records', 'Debtors and creditors ageing']],\n        ['Internal audit', 'Risk-based internal audit of the purchase, sales, inventory and payroll cycles.', ['Process walk-through and risk map', 'Sample testing with findings', 'Report with management action plan'], 'Quarterly / half-yearly', ['Process notes or SOPs', 'Access to ERP / accounting data', 'Previous audit reports']],\n        ['Certificate of Origin', 'Non-preferential and preferential certificates of origin, including SAFTA, ASEAN and other FTA certificates.', ['Origin criteria and HS code check', 'Application on the DGFT CoO portal', 'Certificate issue and amendment support'], '1–3 working days', ['IEC', 'Commercial invoice and packing list', 'Shipping bill / bill of lading', \"Manufacturer's cost sheet for origin criteria\"]],\n        ['RCMC & commodity board registration', 'Registration-cum-membership certificate with an export promotion council or commodity board — Coconut Development Board, Spices Board, APEDA and others.', ['Selection of the right council / board', 'Application with IEC and documents', 'Renewal and membership updates'], '1–3 weeks', ['IEC certificate', 'PAN and GST registration', 'Bank certificate', 'Manufacturing licence, where applicable']],\n        ['Trademark registration', 'Brand name and logo protected through a trademark application in the right classes.', ['Trademark search and class selection', 'TM-A application filing', 'Reply to examination report and opposition'], 'Filing in 2 days · registration 12–18 months', ['Logo / word mark', 'Applicant PAN and address proof', 'Udyam certificate (for reduced government fee)', 'Date of first use, if already in use']],\n        ['FSSAI registration & licence', 'FSSAI basic registration, state licence or central licence for food businesses.', ['Category check by turnover and activity', 'Application on FoSCoS', 'Annual return and renewal'], '7–30 days', ['Photo ID and address proof of proprietor / partners', 'Proof of premises', 'List of food categories', 'Layout plan (for state / central licence)']]\n      ] }\n  ];\n\n  state = { view: null, formSvc: null, sent: false };\n\n  howSteps = [\n    { n: '01', title: 'Enquire', body: 'Send the form or call. We confirm the scope the same working day.' },\n    { n: '02', title: 'Quote & documents', body: 'A fixed fee and a checklist of exactly what we need from you.' },\n    { n: '03', title: 'Prepare & file', body: 'Drafted, reviewed by a qualified professional, filed only after your approval.' },\n    { n: '04', title: 'Close-out', body: 'Acknowledgement shared and the next due date added to your calendar.' }\n  ];\n\n  data = {\n    tickerItems: (() => { const a = ['
